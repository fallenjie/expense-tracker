<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记账本 - H5（本地演示版）</title>
<style>
:root {
  --primary: #FF6B6B;
  --primary-dark: #ee5a5a;
  --secondary: #4ECDC4;
  --income: #6BCB77;
  --expense: #FF6B6B;
  --warning: #FFD93D;
  --bg: #F8F9FA;
  --card: #FFFFFF;
  --text: #2D3436;
  --text-light: #636E72;
  --border: #E9ECEF;
  --shadow: rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); }

/* Auth Screen */
.auth-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px 24px;
  background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 50%, #4ECDC4 100%);
  position: relative;
  overflow: hidden;
}

.auth-screen::before {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  top: -100px;
  right: -100px;
  animation: float 6s ease-in-out infinite;
}

.auth-screen::after {
  content: '';
  position: absolute;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  bottom: -50px;
  left: -50px;
  animation: float 8s ease-in-out infinite reverse;
}

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.05); }
}

.auth-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 24px;
  position: relative;
  z-index: 1;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

.auth-title {
  font-size: 28px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-subtitle {
  text-align: center;
  color: var(--text-light);
  margin-bottom: 32px;
  font-size: 14px;
}

.auth-tabs {
  display: flex;
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 24px;
}

.auth-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-light);
}

.auth-tab.active {
  background: var(--card);
  color: var(--primary);
  box-shadow: 0 2px 8px var(--shadow);
}

.auth-form { display: none; }
.auth-form.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  transition: all 0.3s ease;
  background: var(--bg);
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--card);
}

.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
}

.btn-primary:active {
  transform: scale(0.98);
  box-shadow: 0 4px 12px rgba(255,107,107,0.3);
}

/* Main App */
.main-app {
  display: none;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 20px 20px 60px;
  position: relative;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.header-title {
  font-size: 20px;
  font-weight: 700;
  color: white;
}

.header-user {
  color: white;
  font-size: 14px;
  opacity: 0.9;
}

/* Page Container */
.page { display: none; padding: 0 16px; }
.page.active { display: block; animation: fadeIn 0.3s ease; }

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px var(--shadow);
}

/* Summary Card */
.summary-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  margin: -40px 16px 20px;
  position: relative;
  z-index: 10;
  box-shadow: 0 8px 30px var(--shadow);
  animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
}

.summary-label {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.summary-value {
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
}

.summary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 16px;
}

.summary-item {
  text-align: center;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}

.summary-item.income { border-left: 3px solid var(--income); }
.summary-item.expense { border-left: 3px solid var(--expense); }

.summary-item-label { font-size: 12px; color: var(--text-light); }
.summary-item-value { font-size: 18px; font-weight: 600; margin-top: 4px; }
.summary-item-value.income { color: var(--income); }
.summary-item-value.expense { color: var(--expense); }

/* Quick Add */
.quick-add {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.quick-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.quick-btn.income {
  background: linear-gradient(135deg, var(--income), #5ab565);
  color: white;
}

.quick-btn.expense {
  background: linear-gradient(135deg, var(--expense), var(--primary-dark));
  color: white;
}

.quick-btn:active { transform: scale(0.97); }

/* Recent Records */
.section-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.section-title a {
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}

.record-list { }

.record-item {
  display: flex;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  transition: all 0.2s ease;
}

.record-item:last-child { border-bottom: none; }
.record-item:active { background: var(--bg); margin: 0 -12px; padding: 14px 12px; border-radius: var(--radius-sm); }

.record-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-right: 12px;
  background: var(--bg);
}

.record-info { flex: 1; }
.record-name { font-size: 15px; font-weight: 500; }
.record-note { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.record-amount { font-size: 16px; font-weight: 600; }
.record-amount.income { color: var(--income); }
.record-amount.expense { color: var(--expense); }
.record-date { font-size: 11px; color: var(--text-light); margin-top: 2px; text-align: right; }

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: var(--card);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  box-shadow: 0 -4px 20px var(--shadow);
  z-index: 100;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 16px;
  color: var(--text-light);
  text-decoration: none;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab-item .icon { font-size: 24px; margin-bottom: 4px; }

.tab-item.active { color: var(--primary); }
.tab-item.active .icon { transform: scale(1.1); }

/* Add Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.active { display: flex; align-items: flex-end; }

.modal {
  background: var(--card);
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 430px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 1;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
}

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-light);
}

.modal-body { padding: 20px; }

/* Type Toggle */
.type-toggle {
  display: flex;
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 20px;
}

.type-btn {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-light);
  border: none;
  background: transparent;
}

.type-btn.active.income { background: var(--income); color: white; }
.type-btn.active.expense { background: var(--expense); color: white; }

/* Category Grid */
.category-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.category-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  border: 2px solid transparent;
}

.category-item:active { transform: scale(0.95); }
.category-item.selected { border-color: var(--primary); background: rgba(255,107,107,0.1); }

.category-item .icon { font-size: 24px; margin-bottom: 4px; }
.category-item .name { font-size: 10px; color: var(--text-light); text-align: center; }

/* Custom Category */
.custom-cat-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

.custom-cat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.custom-cat-header span { font-size: 14px; font-weight: 500; color: var(--text-light); }

.add-cat-btn {
  padding: 6px 12px;
  background: var(--bg);
  border: none;
  border-radius: 6px;
  font-size: 12px;
  color: var(--primary);
  cursor: pointer;
}

.custom-cat-list { display: flex; flex-wrap: wrap; gap: 8px; }

.custom-cat-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  background: var(--bg);
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.custom-cat-item:hover { background: var(--border); }
.custom-cat-item .delete-cat {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--expense);
  color: white;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}

.custom-cat-item:hover .delete-cat { opacity: 1; }

/* Bill Page */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.filter-btn {
  padding: 8px 16px;
  background: var(--card);
  border: none;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
  box-shadow: 0 2px 8px var(--shadow);
}

.filter-btn.active { background: var(--primary); color: white; }

.search-box {
  display: flex;
  align-items: center;
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px var(--shadow);
}

.search-box input {
  flex: 1;
  border: none;
  background: none;
  font-size: 15px;
  outline: none;
}

.search-box .icon { margin-right: 10px; color: var(--text-light); }

.date-range {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.date-input {
  flex: 1;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: var(--card);
}

.date-input:focus { outline: none; border-color: var(--primary); }

/* Report Page */
.tabs {
  display: flex;
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 20px;
}

.tab-btn {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-light);
  border: none;
  background: transparent;
}

.tab-btn.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px var(--shadow); }

.report-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.report-stat {
  background: var(--card);
  padding: 16px;
  border-radius: var(--radius-sm);
  text-align: center;
  box-shadow: 0 2px 12px var(--shadow);
}

.report-stat .label { font-size: 12px; color: var(--text-light); }
.report-stat .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
.report-stat .value.income { color: var(--income); }
.report-stat .value.expense { color: var(--expense); }

/* Pie Chart */
.pie-container { margin: 20px 0; }

.pie-chart {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  margin: 0 auto 20px;
  position: relative;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}

.pie-center {
  width: 120px;
  height: 120px;
  background: var(--card);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.pie-center .amount { font-size: 16px; font-weight: 700; }
.pie-center .label { font-size: 11px; color: var(--text-light); }

.pie-legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* Category Page */
.category-section { margin-bottom: 24px; }

.category-section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-light);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.admin-btn {
  padding: 6px 12px;
  background: var(--bg);
  border: none;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-light);
  cursor: pointer;
  margin-left: auto;
}

.admin-btn:active { background: var(--border); }

.category-list {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.cat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 8px;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: 0 2px 8px var(--shadow);
  cursor: pointer;
  transition: all 0.2s ease;
  border: 2px solid transparent;
}

.cat-btn:active { transform: scale(0.95); }
.cat-btn.selected { border-color: var(--primary); }

.cat-btn .icon { font-size: 28px; margin-bottom: 6px; }
.cat-btn .name { font-size: 11px; color: var(--text-light); text-align: center; }

.delete-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--expense);
  color: white;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  top: -6px;
  right: -6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.cat-btn:hover .delete-btn { opacity: 1; }
.cat-btn { position: relative; }

/* Settings Page */
.settings-list { }

.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.settings-item:last-child { border-bottom: none; }

.settings-info { }
.settings-label { font-size: 15px; font-weight: 500; }
.settings-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }

.settings-value {
  font-size: 14px;
  color: var(--text-light);
}

.budget-input {
  width: 100px;
  padding: 8px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  text-align: right;
}

.budget-input:focus { outline: none; border-color: var(--primary); }

.btn-danger {
  background: linear-gradient(135deg, var(--expense), var(--primary-dark));
  color: white;
  margin-top: 20px;
}

.btn-secondary {
  background: var(--bg);
  color: var(--text);
  margin-top: 12px;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}

.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--text);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 300;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 350px;
  text-align: center;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.warning { background: var(--warning); color: var(--text); }
.toast.success { background: var(--income); }

/* Confirm Dialog */
.confirm-dialog {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  z-index: 250;
  width: 300px;
  text-align: center;
  animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.confirm-dialog.show { display: block; }

@keyframes modalPop {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.confirm-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.confirm-msg { font-size: 14px; color: var(--text-light); margin-bottom: 20px; }

.confirm-btns { display: flex; gap: 12px; }

.confirm-btns button {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.confirm-cancel { background: var(--bg); color: var(--text); }
.confirm-ok { background: var(--primary); color: white; }

/* Month Selector */
.month-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
}

.month-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.month-btn:active { background: var(--border); }

.month-label {
  font-size: 16px;
  font-weight: 600;
  min-width: 100px;
  text-align: center;
}

/* Daily Report */
.daily-list { }

.daily-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.daily-item:last-child { border-bottom: none; }
.daily-date { font-size: 13px; color: var(--text-light); }
.daily-day { font-size: 12px; color: var(--text-light); }
.daily-amount { font-size: 15px; font-weight: 600; }
.daily-amount.expense { color: var(--expense); }
.daily-amount.income { color: var(--income); }

/* Animation utilities */
.animate-in { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</head>
<body>
<div class="app">
  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-title">记账本</div>
      <div class="auth-subtitle">H5 本地演示版</div>
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">登录</div>
        <div class="auth-tab" data-tab="register">注册</div>
      </div>
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" class="form-input" id="loginPhone" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" id="loginPwd" placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary">登录</button>
      </form>
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" id="regPwd" placeholder="设置密码（6位以上）">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" class="form-input" id="regPwd2" placeholder="再次输入密码">
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div class="main-app" id="mainApp">
    <div class="header">
      <div class="header-top">
        <div class="header-title">记账本</div>
        <div class="header-user" id="headerUser"></div>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">本月结余</div>
      <div class="summary-value" id="monthBalance">¥0.00</div>
      <div class="summary-row">
        <div class="summary-item income">
          <div class="summary-item-label">本月收入</div>
          <div class="summary-item-value income" id="monthIncome">¥0.00</div>
        </div>
        <div class="summary-item expense">
          <div class="summary-item-label">本月支出</div>
          <div class="summary-item-value expense" id="monthExpense">¥0.00</div>
        </div>
      </div>
    </div>

    <!-- Home Page -->
    <div class="page active" id="homePage">
      <div class="quick-add">
        <button class="quick-btn income" onclick="showAddModal('income')">+ 记收入</button>
        <button class="quick-btn expense" onclick="showAddModal('expense')">+ 记支出</button>
      </div>
      <div class="card">
        <div class="section-title">最近记录<span><a href="#" onclick="switchTab('bill')">全部</a></span></div>
        <div class="record-list" id="recentRecords"></div>
      </div>
    </div>

    <!-- Bill Page -->
    <div class="page" id="billPage">
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" placeholder="搜索备注..." id="searchInput" oninput="filterRecords()">
      </div>
      <div class="date-range">
        <input type="date" class="date-input" id="startDate" onchange="filterRecords()">
        <input type="date" class="date-input" id="endDate" onchange="filterRecords()">
      </div>
      <div class="filter-bar" id="typeFilter">
        <button class="filter-btn active" data-type="all">全部</button>
        <button class="filter-btn" data-type="income">收入</button>
        <button class="filter-btn" data-type="expense">支出</button>
      </div>
      <div class="card">
        <div class="record-list" id="allRecords"></div>
      </div>
    </div>

    <!-- Report Page -->
    <div class="page" id="reportPage">
      <div class="month-selector">
        <button class="month-btn" onclick="changeMonth(-1)">◀</button>
        <span class="month-label" id="reportMonthLabel">2026年4月</span>
        <button class="month-btn" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-report="day" onclick="switchReport('day')">日报</button>
        <button class="tab-btn" data-report="month" onclick="switchReport('month')">月报</button>
      </div>
      <div class="report-summary" id="reportSummary">
        <div class="report-stat">
          <div class="label">总收入</div>
          <div class="value income" id="reportIncome">¥0</div>
        </div>
        <div class="report-stat">
          <div class="label">总支出</div>
          <div class="value expense" id="reportExpense">¥0</div>
        </div>
      </div>
      <div class="card" id="reportContent"></div>
    </div>

    <!-- Category Page -->
    <div class="page" id="categoryPage">
      <div class="category-section">
        <div class="category-section-title">💸 支出分类 <button class="admin-btn" onclick="showAddCatModal('expense')">+ 添加</button></div>
        <div class="category-list" id="expenseCats"></div>
      </div>
      <div class="category-section">
        <div class="category-section-title">💰 收入分类 <button class="admin-btn" onclick="showAddCatModal('income')">+ 添加</button></div>
        <div class="category-list" id="incomeCats"></div>
      </div>
    </div>

    <!-- Settings Page -->
    <div class="page" id="settingsPage">
      <div class="card">
        <div class="settings-list">
          <div class="settings-item">
            <div class="settings-info">
              <div class="settings-label">月度预算</div>
              <div class="settings-desc">设置每月支出上限，超出提醒</div>
            </div>
            <input type="number" class="budget-input" id="budgetInput" placeholder="0" onchange="saveBudget()">
          </div>
        </div>
      </div>
      <button class="btn btn-danger" onclick="logout()">退出登录</button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('home')">
        <span class="icon">🏠</span>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="switchTab('bill')">
        <span class="icon">📋</span>
        <span>账单</span>
      </div>
      <div class="tab-item" onclick="switchTab('report')">
        <span class="icon">📊</span>
        <span>报表</span>
      </div>
      <div class="tab-item" onclick="switchTab('category')">
        <span class="icon">🏷️</span>
        <span>分类</span>
      </div>
      <div class="tab-item" onclick="switchTab('settings')">
        <span class="icon">⚙️</span>
        <span>设置</span>
      </div>
    </div>
  </div>

  <!-- Add Record Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">记一笔</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="type-toggle">
          <button class="type-btn expense active" data-type="expense" onclick="setRecordType('expense')">支出</button>
          <button class="type-btn income" data-type="income" onclick="setRecordType('income')">收入</button>
        </div>
        <div class="form-group">
          <label>金额</label>
          <input type="number" class="form-input" id="amountInput" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
          <label>分类</label>
          <div class="category-grid" id="modalCats"></div>
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" class="form-input" id="noteInput" placeholder="选填">
        </div>
        <div class="custom-cat-section" id="modalCustomCats"></div>
        <button class="btn btn-primary" style="margin-top:20px" onclick="saveRecord()">保存</button>
      </div>
    </div>
  </div>

  <!-- Add Category Modal -->
  <div class="modal-overlay" id="addCatModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">添加分类</span>
        <button class="modal-close" onclick="closeCatModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>分类名称</label>
          <input type="text" class="form-input" id="catNameInput" placeholder="如：咖啡">
        </div>
        <div class="form-group">
          <label>选择图标</label>
          <div class="category-grid" id="iconPicker"></div>
        </div>
        <button class="btn btn-primary" style="margin-top:20px" onclick="saveCategory()">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Confirm Dialog -->
  <div class="modal-overlay" id="confirmOverlay">
    <div class="confirm-dialog" id="confirmDialog">
      <div class="confirm-title" id="confirmTitle">确认删除？</div>
      <div class="confirm-msg" id="confirmMsg">此操作不可撤销</div>
      <div class="confirm-btns">
        <button class="confirm-cancel" onclick="closeConfirm()">取消</button>
        <button class="confirm-ok" id="confirmOk" onclick="doConfirm()">确定</button>
      </div>
    </div>
  </div>
</div>

<script>
// Data
const DEFAULT_EXPENSE_CATS = [
  {id:'meal',name:'餐饮',icon:'🍜'},{id:'transport',name:'交通',icon:'🚗'},{id:'shopping',name:'购物',icon:'🛒'},
  {id:'entertainment',name:'娱乐',icon:'🎮'},{id:'housing',name:'居住',icon:'🏠'},{id:'medical',name:'医疗',icon:'🏥'},
  {id:'education',name:'教育',icon:'📚'},{id:'communication',name:'通讯',icon:'📱'},{id:'beauty',name:'护肤',icon:'💄'},
  {id:'travel',name:'旅游',icon:'✈️'},{id:'fitness',name:'运动健身',icon:'💪'},{id:'pet',name:'宠物',icon:'🐶'},
  {id:'social',name:'社交',icon:'🎁'},{id:'smoke',name:'烟酒',icon:'🚬'},{id:'investment',name:'投资',icon:'📈'},
  {id:'car',name:'汽车',icon:'🚙'},{id:'baby',name:'母婴',icon:'👶'},{id:'other',name:'其他',icon:'📌'}
];

const DEFAULT_INCOME_CATS = [
  {id:'salary',name:'工资',icon:'💼'},{id:'parttime',name:'兼职',icon:'💻'},{id:'finance',name:'投资理财',icon:'📈'},
  {id:'passive',name:'被动收入',icon:'🏠'},{id:'bonus',name:'红包',icon:'🧧'},{id:'other_income',name:'其他',icon:'📌'}
];

const ICONS = ['🍎','🍊','🍋','🍓','🍒','🥝','🍑','🥭','🍔','🍕','☕','🍵','🎬','🎮','🎯','🏀','⚽','🎸','🎹','📷','💄','👗','👠','💍','🎁','🌸','🌺','🌻','🌹','🍀','⭐','🌙','🔥','💡','🎈','🎉','🏆','🎪','🎭','🧩','🔮'];

// State
let currentUser = null;
let records = [];
let expenseCats = [...DEFAULT_EXPENSE_CATS];
let incomeCats = [...DEFAULT_INCOME_CATS];
let currentRecordType = 'expense';
let currentRecordCat = null;
let reportMonthOffset = 0;
let reportType = 'day';
let currentAddCatType = 'expense';
let selectedIcon = '🍎';
let confirmCallback = null;
let budget80Shown = false;
let budget100Shown = false;

// Init
document.addEventListener('DOMContentLoaded', () => {
  initAuth();
  initFilters();
  initIconPicker();
});

function initAuth() {
  const users = JSON.parse(localStorage.getItem('et_users') || '{}');
  const lastUser = localStorage.getItem('et_lastUser');
  if (lastUser && users[lastUser]) {
    currentUser = lastUser;
    showMainApp();
  }

  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
    });
  });

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const phone = document.getElementById('loginPhone').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    const users = JSON.parse(localStorage.getItem('et_users') || '{}');
    if (!users[phone] || users[phone].pwd !== pwd) {
      showToast('手机号或密码错误', 'warning');
      return;
    }
    currentUser = phone;
    localStorage.setItem('et_lastUser', phone);
    showMainApp();
  });

  document.getElementById('registerForm').addEventListener('submit', e => {
    e.preventDefault();
    const phone = document.getElementById('regPhone').value.trim();
    const pwd = document.getElementById('regPwd').value;
    const pwd2 = document.getElementById('regPwd2').value;
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号', 'warning'); return; }
    if (pwd.length < 6) { showToast('密码至少6位', 'warning'); return; }
    if (pwd !== pwd2) { showToast('两次密码不一致', 'warning'); return; }
    const users = JSON.parse(localStorage.getItem('et_users') || '{}');
    if (users[phone]) { showToast('手机号已注册', 'warning'); return; }
    users[phone] = { pwd, created: Date.now() };
    localStorage.setItem('et_users', JSON.stringify(users));
    currentUser = phone;
    localStorage.setItem('et_lastUser', phone);
    showToast('注册成功', 'success');
    showMainApp();
  });
}

function showMainApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('headerUser').textContent = currentUser;
  loadUserData();
  renderAll();
}

function loadUserData() {
  const userData = JSON.parse(localStorage.getItem('et_data_' + currentUser) || '{}');
  records = userData.records || [];
  expenseCats = userData.expenseCats || [...DEFAULT_EXPENSE_CATS];
  incomeCats = userData.incomeCats || [...DEFAULT_INCOME_CATS];
  document.getElementById('budgetInput').value = userData.budget || '';
}

function saveUserData() {
  const userData = {
    records,
    expenseCats,
    incomeCats,
    budget: parseFloat(document.getElementById('budgetInput').value) || 0
  };
  localStorage.setItem('et_data_' + currentUser, JSON.stringify(userData));
}

function renderAll() {
  renderSummary();
  renderRecentRecords();
  renderCats();
  renderReport();
}

function renderSummary() {
  const now = new Date();
  const month = now.getMonth();
  const year = now.getFullYear();
  const monthRecords = records.filter(r => {
    const d = new Date(r.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });
  const income = monthRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  const expense = monthRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  document.getElementById('monthIncome').textContent = '¥' + income.toFixed(2);
  document.getElementById('monthExpense').textContent = '¥' + expense.toFixed(2);
  document.getElementById('monthBalance').textContent = '¥' + (income - expense).toFixed(2);
}

function renderRecentRecords() {
  const container = document.getElementById('recentRecords');
  const recent = [...records].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  container.innerHTML = recent.length ? recent.map(r => renderRecordItem(r)).join('') : '<div class="empty-state"><div class="icon">📝</div><p>暂无记录</p></div>';
}

function renderRecordItem(r) {
  const cats = r.type === 'income' ? incomeCats : expenseCats;
  const cat = cats.find(c => c.id === r.cat) || {icon:'📌',name:'其他'};
  const date = new Date(r.date);
  const dateStr = `${date.getMonth()+1}月${date.getDate()}日`;
  return `<div class="record-item" onclick="editRecord('${r.id}')">
    <div class="record-icon">${cat.icon}</div>
    <div class="record-info">
      <div class="record-name">${cat.name}</div>
      <div class="record-note">${r.note || ''}</div>
    </div>
    <div>
      <div class="record-amount ${r.type}">${r.type==='income'?'+':'-'}¥${r.amount.toFixed(2)}</div>
      <div class="record-date">${dateStr}</div>
    </div>
  </div>`;
}

function renderCats() {
  const expenseContainer = document.getElementById('expenseCats');
  const incomeContainer = document.getElementById('incomeCats');
  expenseContainer.innerHTML = expenseCats.map(c => `<div class="cat-btn" onclick="deleteCat('expense','${c.id}')">${c.icon}<span class="name">${c.name}</span><span class="delete-btn" onclick="event.stopPropagation();confirmDeleteCat('expense','${c.id}')">×</span></div>`).join('');
  incomeContainer.innerHTML = incomeCats.map(c => `<div class="cat-btn" onclick="deleteCat('income','${c.id}')">${c.icon}<span class="name">${c.name}</span><span class="delete-btn" onclick="event.stopPropagation();confirmDeleteCat('income','${c.id}')">×</span></div>`).join('');
}

function initFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterRecords();
    });
  });
}

function filterRecords() {
  const type = document.querySelector('.filter-btn.active').dataset.type;
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;

  let filtered = records;
  if (type !== 'all') filtered = filtered.filter(r => r.type === type);
  if (search) filtered = filtered.filter(r => (r.note || '').toLowerCase().includes(search));
  if (startDate) filtered = filtered.filter(r => r.date >= startDate);
  if (endDate) filtered = filtered.filter(r => r.date <= endDate);

  filtered = filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('allRecords').innerHTML = filtered.length ? filtered.map(r => renderRecordItem(r)).join('') : '<div class="empty-state"><div class="icon">🔍</div><p>没有找到记录</p></div>';
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById(tab + 'Page').classList.add('active');
  document.querySelector(`.tab-item:nth-child(${['home','bill','report','category','settings'].indexOf(tab)+1})`).classList.add('active');
  if (tab === 'bill') filterRecords();
  if (tab === 'report') renderReport();
}

function showAddModal(type) {
  currentRecordType = type;
  currentRecordCat = null;
  setRecordType(type);
  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  document.getElementById('addModal').classList.add('active');
  renderModalCats();
}

function closeModal() {
  document.getElementById('addModal').classList.remove('active');
}

function setRecordType(type) {
  currentRecordType = type;
  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  renderModalCats();
}

function renderModalCats() {
  const cats = currentRecordType === 'income' ? incomeCats : expenseCats;
  const container = document.getElementById('modalCats');
  container.innerHTML = cats.map(c => `<div class="category-item ${currentRecordCat===c.id?'selected':''}" onclick="selectCat('${c.id}')"><span class="icon">${c.icon}</span><span class="name">${c.name}</span></div>`).join('');
  document.getElementById('modalCustomCats').innerHTML = '<div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">自定义分类</div><div class="custom-cat-list" id="modalCustomList"></div>';
  renderModalCustomCats();
}

function renderModalCustomCats() {
  const customCats = currentRecordType === 'income' ? incomeCats.filter(c => !DEFAULT_INCOME_CATS.find(d => d.id === c.id)) : expenseCats.filter(c => !DEFAULT_EXPENSE_CATS.find(d => d.id === c.id));
  document.getElementById('modalCustomList').innerHTML = customCats.length ? customCats.map(c => `<div class="custom-cat-item ${currentRecordCat===c.id?'selected':''}" onclick="selectCat('${c.id}')">${c.icon} ${c.name}</div>`).join('') : '<span style="font-size:12px;color:var(--text-light)">无自定义分类</span>';
}

function selectCat(id) {
  currentRecordCat = id;
  renderModalCats();
}

function saveRecord() {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const note = document.getElementById('noteInput').value.trim();
  if (!amount || amount <= 0) { showToast('请输入有效金额', 'warning'); return; }
  if (!currentRecordCat) { showToast('请选择分类', 'warning'); return; }

  const record = {
    id: Date.now().toString(),
    type: currentRecordType,
    amount,
    cat: currentRecordCat,
    note,
    date: new Date().toISOString().split('T')[0]
  };
  records.push(record);
  saveUserData();
  closeModal();
  renderAll();
  showToast('记录成功', 'success');

  // Budget check
  const userData = JSON.parse(localStorage.getItem('et_data_' + currentUser) || '{}');
  const budget = userData.budget || 0;
  if (budget > 0 && currentRecordType === 'expense') {
    const now = new Date();
    const monthExp = records.filter(r => {
      const d = new Date(r.date);
      return r.type === 'expense' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).reduce((s, r) => s + r.amount, 0);
    const pct = monthExp / budget;
    if (pct >= 1 && !budget100Shown) { showToast('⚠️ 已达月度预算上限！', 'warning'); budget100Shown = true; budget80Shown = true; }
    else if (pct >= 0.8 && !budget80Shown) { showToast('⚠️ 已达预算80%，注意控制支出', 'warning'); budget80Shown = true; }
  }
}

function editRecord(id) {
  const record = records.find(r => r.id === id);
  if (!record) return;
  records = records.filter(r => r.id !== id);
  currentRecordType = record.type;
  currentRecordCat = record.cat;
  document.getElementById('amountInput').value = record.amount;
  document.getElementById('noteInput').value = record.note;
  document.getElementById('addModal').classList.add('active');
  renderModalCats();
}

function showAddCatModal(type) {
  currentAddCatType = type;
  selectedIcon = ICONS[0];
  document.getElementById('catNameInput').value = '';
  document.getElementById('addCatModal').classList.add('active');
  renderIconPicker();
}

function closeCatModal() {
  document.getElementById('addCatModal').classList.remove('active');
}

function initIconPicker() {
  renderIconPicker();
}

function renderIconPicker() {
  document.getElementById('iconPicker').innerHTML = ICONS.map(i => `<div class="category-item ${selectedIcon===i?'selected':''}" onclick="selectIcon('${i}')"><span class="icon">${i}</span></div>`).join('');
}

function selectIcon(icon) {
  selectedIcon = icon;
  renderIconPicker();
}

function saveCategory() {
  const name = document.getElementById('catNameInput').value.trim();
  if (!name) { showToast('请输入分类名称', 'warning'); return; }
  const id = 'custom_' + Date.now();
  const cat = { id, name, icon: selectedIcon };
  if (currentAddCatType === 'expense') expenseCats.push(cat);
  else incomeCats.push(cat);
  saveUserData();
  closeCatModal();
  renderCats();
  showToast('分类添加成功', 'success');
}

function confirmDeleteCat(type, id) {
  showConfirm('确认删除？', '删除后相关记录将保留但分类显示为"其他"', () => {
    deleteCat(type, id);
  });
}

function deleteCat(type, id) {
  if (type === 'expense') expenseCats = expenseCats.filter(c => c.id !== id);
  else incomeCats = incomeCats.filter(c => c.id !== id);
  saveUserData();
  renderCats();
  showToast('分类已删除', 'success');
}

function switchReport(type) {
  reportType = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.report === type));
  renderReport();
}

function changeMonth(delta) {
  reportMonthOffset += delta;
  renderReport();
}

function renderReport() {
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth() + reportMonthOffset, 1);
  const year = target.getFullYear();
  const month = target.getMonth();
  const monthLabel = `${year}年${month+1}月`;
  document.getElementById('reportMonthLabel').textContent = monthLabel;

  const monthRecords = records.filter(r => {
    const d = new Date(r.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });

  const income = monthRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  const expense = monthRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  document.getElementById('reportIncome').textContent = '¥' + income.toFixed(0);
  document.getElementById('reportExpense').textContent = '¥' + expense.toFixed(0);

  if (reportType === 'day') {
    const days = {};
    monthRecords.forEach(r => {
      const day = r.date;
      if (!days[day]) days[day] = { income: 0, expense: 0 };
      days[day][r.type] += r.amount;
    });
    const sorted = Object.keys(days).sort();
    document.getElementById('reportContent').innerHTML = sorted.length ? sorted.map(d => {
      const date = new Date(d);
      const weekday = ['日','一','二','三','四','五','六'][date.getDay()];
      return `<div class="daily-item">
        <div><span class="daily-date">${date.getMonth()+1}/${date.getDate()}</span><span class="daily-day"> 周${weekday}</span></div>
        <div>
          ${days[d].expense ? `<span class="daily-amount expense">-¥${days[d].expense.toFixed(0)}</span>` : ''}
          ${days[d].income ? `<span class="daily-amount income" style="margin-left:12px">+¥${days[d].income.toFixed(0)}</span>` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="empty-state"><div class="icon">📅</div><p>本月暂无记录</p></div>';
  } else {
    // Month report with pie chart
    const cats = expenseCats;
    const catTotals = {};
    monthRecords.filter(r => r.type === 'expense').forEach(r => {
      catTotals[r.cat] = (catTotals[r.cat] || 0) + r.amount;
    });
    const sorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

    if (sorted.length === 0) {
      document.getElementById('reportContent').innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>本月暂无支出</p></div>';
      return;
    }

    const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E2','#F8B500','#E74C3C'];
    let gradient = 'conic-gradient(';
    let cumulative = 0;
    sorted.forEach(([cat, amount], i) => {
      const pct = amount / expense;
      gradient += `${colors[i % colors.length]} ${cumulative * 360}deg ${(cumulative + pct) * 360}deg,`;
      cumulative += pct;
    });
    gradient = gradient.slice(0, -1) + ')';

    const legend = sorted.map(([cat, amount], i) => {
      const catInfo = cats.find(c => c.id === cat) || {icon:'📌',name:'其他'};
      return `<div class="legend-item"><span class="legend-dot" style="background:${colors[i % colors.length]}"></span>${catInfo.icon} ${catInfo.name} ¥${amount.toFixed(0)}</div>`;
    }).join('');

    document.getElementById('reportContent').innerHTML = `
      <div class="pie-container">
        <div class="pie-chart" style="background:${gradient}">
          <div class="pie-center">
            <span class="amount">¥${expense.toFixed(0)}</span>
            <span class="label">支出总额</span>
          </div>
        </div>
        <div class="pie-legend">${legend}</div>
      </div>`;
  }
}

function saveBudget() {
  saveUserData();
  budget80Shown = false;
  budget100Shown = false;
  showToast('预算已设置', 'success');
}

function logout() {
  showConfirm('确认退出？', '退出后需要重新登录', () => {
    localStorage.removeItem('et_lastUser');
    location.reload();
  });
}

function showConfirm(title, msg, callback) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = callback;
  document.getElementById('confirmOverlay').classList.add('active');
  document.getElementById('confirmDialog').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('active');
  document.getElementById('confirmDialog').classList.remove('show');
  confirmCallback = null;
}

function doConfirm() {
  if (confirmCallback) confirmCallback();
  closeConfirm();
}

function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type;
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
</body>
